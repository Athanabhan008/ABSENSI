<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: #f5f7fb;
      font-family: 'Inter', sans-serif;
    }
    .sidebar {
      width: 260px;
      position: fixed;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
    }
    .content {
      margin-left: 260px;
      padding: 24px;
    }
    .card {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.05);
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
    }
    .stat-label {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar p-3">
  <h4 class="mb-4">Admin Panel</h4>
  <ul class="nav flex-column gap-2">
    <li class="nav-item"><a class="nav-link active" href="#"><i class="ti ti-home"></i> Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="#"><i class="ti ti-users"></i> Users</a></li>
    <li class="nav-item"><a class="nav-link" href="#"><i class="ti ti-file"></i> Reports</a></li>
    <li class="nav-item"><a class="nav-link" href="#"><i class="ti ti-settings"></i> Settings</a></li>
  </ul>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Dashboard</h3>
    <button class="btn btn-primary">Create Report</button>
  </div>

  <!-- STATS -->
  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <div class="card p-4">
        <div class="stat-label">Total Users</div>
        <div class="stat-value">75,782</div>
        <small class="text-success">▲ 2%</small>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-4">
        <div class="stat-label">Active Users</div>
        <div class="stat-value">25,782</div>
        <small class="text-danger">▼ 1%</small>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-4">
        <div class="stat-label">Revenue</div>
        <div class="stat-value">$4,300</div>
        <small class="text-success">▲ 8%</small>
      </div>
    </div>
  </div>

  <!-- CHART PLACEHOLDER -->
  <div class="card p-4 mb-4">
    <h5>Traffic Summary</h5>
    <div class="mt-3" style="height:200px;background:#eef2ff;border-radius:8px;display:flex;align-items:center;justify-content:center;">
      <span class="text-muted">Chart Area</span>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card p-4">
    <h5>Recent Users</h5>
    <table class="table mt-3">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>John Doe</td>
          <td>john@example.com</td>
          <td><span class="badge bg-success">Active</span></td>
        </tr>
        <tr>
          <td>Jane Smith</td>
          <td>jane@example.com</td>
          <td><span class="badge bg-secondary">Inactive</span></td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
